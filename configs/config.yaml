defaults:
  - model: sutureformer
  - dataset: surgical_trajectory_kf6
  - trainer: default
  - _self_

seed: 42

hydra:
  job:
    chdir: false
  run:
    dir: logs/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: logs/hydra/sweeps/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
