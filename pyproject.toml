[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sutureformer"
version = "0.1.0"
description = "Learning Surgical Trajectories via Goal-conditioned Offline RL in Pixel Space"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "wandb",
    "tensorboard",
    "numpy>=1.24",
    "scipy>=1.10",
    "Pillow>=9.0",
    "opencv-python>=4.7",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "black",
    "isort",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sutureformer*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["sutureformer"]
